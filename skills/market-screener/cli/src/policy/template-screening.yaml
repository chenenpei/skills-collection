# 顶层 version 标识政策族；子规则随同一文件维护，不单独标版本。
# 模板筛选政策：用于美股当前运行，并保留历史 CN 模板解释所需规则。
# 新 A 股筛选只使用 cn-screening.yaml，不使用这里的席位、投票或行业模板。
# 百分比/小数的单位沿用各指标名及 fundamentals.ts 的定义，避免混用两种尺度。
version: template-screening
status: active
tightening_profile: required-with-supporting
# 市场范围与硬性排除
exclusionRules:
  universe:
    security_type: security_single_company
    exclude_pooled_vehicles: true
    profile_b:
      slug: market_cap_profile_b
      CN:
        market_cap_min_cny: 2000000000
        listing_age_min_years: 3
      US:
        market_cap_min_usd: 300000000
        listing_age_min_years: 2
    status_exclusions:
      slug: universe_exclude_status
      CN:
        - ST
        - delisting
        - suspended
      US:
        - halted
        - delisted
  gates:
    - id: status_excluded
      phase: universe
      action: exclude
      reason_slug: kill_status_excluded
    - id: market_cap_below_floor
      phase: universe
      action: exclude
      reason_slug: kill_market_cap_below_floor
    - id: listing_age_below_floor
      phase: universe
      action: exclude
      reason_slug: kill_listing_age_below_floor
    - id: revenue_decline_3y_consecutive
      phase: shared
      action: exclude
      condition: revenue_yoy_negative_each_of_last_3_years
      reason_slug: kill_revenue_decline_3y_consecutive
      note: Sector templates apply additional filters
    - id: ocf_negative_widening_loss
      phase: shared
      action: exclude
      condition: ocf_negative_2_consecutive_years_and_net_loss_widening
      reason_slug: kill_ocf_negative_widening_loss
    - id: non_standard_audit
      phase: shared
      action: exclude
      condition:
        CN: audit_opinion_non_standard
        US: going_concern_emphasis
      reason_slug: kill_non_standard_audit
    - id: key_fields_missing
      phase: shared
      action: exclude
      condition: missing_count_gte_3
      fields:
        - revenue
        - net_income
        - market_cap
        - operating_cash_flow
      reason_slug: kill_key_fields_missing
      note: >
        CLI flags flag_key_fields_unavailable when all tracked financial fields
        are absent (quote-only live tier) instead of excluding — prefer wide in
        until financial enrichment is available.
    - id: data_stale_flag_only
      phase: shared
      action: flag
      condition: latest_financial_data_older_than_months_18
      set: data_confidence_low
      reason_slug: flag_data_stale
      note: Do not exclude; Deep audit re-checks
  flags_not_exclusions:
    - id: revenue_decline_ocf_positive
      condition: revenue_yoy_negative_1y_and_ocf_positive
      funnel_flag: revenue_decline_ocf_positive
    - id: profit_loss_ocf_divergence
      condition: net_loss_and_ocf_positive
      funnel_flag: profit_loss_ocf_divergence
  live_quote_prefilter:
    applies_when: adapter_live
    phase: before_financial_enrichment
    shared_with: universe gates (status_excluded, market_cap_below_floor,
      listing_age_below_floor)
    implementation: cli/src/us/screening.ts
    output_artifact: prefilter-excluded.yaml
    note: >
      Skipped securities are not enriched (saves HTTP). They are excluded from
      the enriched funnel universe but counted in run_metadata.universe_count.
      Funnel kill gates apply only to enriched survivors; prefilter skips appear
      only in prefilter-excluded.yaml, not in excluded.yaml.
  enrichment_failures:
    optional_field: enrichment_failure
    values:
      cik_unresolved: US ticker not in SEC company_tickers map
      fetch_failed: per-ticker HTTP or parse error (record kept quote-only; may
        flag_key_fields_unavailable)
# 指标来源、缺失处理与可用性说明
metricPolicy:
  threshold_syntax:
    simple:
      example:
        min: 0.12
      meaning: metric value must be >= min
    max_only:
      example:
        max: 0.25
      meaning: metric value must be <= max
    market_overrides:
      example:
        default: 0.009
        market_overrides:
          CN: 0.0075
          US: 0.009
      meaning: Use market-specific floor/ceiling when market is CN or US
    market_metric:
      example:
        CN:
          min: 1.5
        US:
          field: rbc_ratio
          min: 200
          missing: data_confidence_low
      meaning: Different metric fields per market when definitions differ
    missing:
      values:
        - skip
        - data_confidence_low
      skip: metric not counted toward supporting pass count
      data_confidence_low: record low confidence; do not prekill at funnel stage
    allowed_keys:
      note: CLI threshold evaluator only understands these rule keys
      keys:
        - min
        - max
        - default
        - market_overrides
        - missing
        - field
      unsupported_example:
        max_decline_pp: 5
  derived_metrics:
    gross_margin_3y_max_decline_pp:
      meaning: Largest peak-to-trough drop in gross margin over the last 3 fiscal years
      unit: percentage_points
      example: 2.5 means a 2.5pp decline from the 3y peak margin
      compute_from: annual gross_margin series in enrichment layer (cli/src/us/sources/fundamentals.ts)
      threshold:
        max: 5
      replaces: gross_margin_3y_stable with max_decline_pp rule (removed — engine
        ignored it)
    operating_margin:
      meaning: Latest fiscal-year operating margin (operating profit / revenue when
        available)
      unit: ratio
      compute_from: cli/src/us/sources/fundamentals.ts — operatingProfit/revenue only; omit when missing
      used_by: operating_margin_vs_industry benchmark overlay
    gross_margin_vs_industry:
      meaning: Security gross margin minus industry-peer median gross margin (same
        market + industryProxy group)
      unit: ratio
      compute_from: cli/src/us/sources/fundamentals.ts after enrichment
      threshold_example:
        min: 0.05
    operating_margin_vs_industry:
      meaning: Security operating margin minus industry-peer median operating margin
      unit: ratio
      compute_from: cli/src/us/sources/fundamentals.ts — median of operating_margin within
        industryProxy group
      threshold_example:
        min: 0
      note: Requires operating_margin from derive; not a ROE proxy
    capex_to_revenue:
      meaning: Average of abs(capex) / revenue over last 2–3 fiscal years with capex
        data
      min_years: 2
      confidence: medium when 2 years, high when 3 years
      unit: ratio
      compute_from: cli/src/us/sources/fundamentals.ts — CONSTRUCT_LONG_ASSET (CN) or SEC capex
        tags (US)
      threshold_example:
        max: 0.15
    inventory_turnover_vs_industry:
      meaning: Security inventory turnover minus industry-peer median turnover
      unit: ratio
      compute_from: cli/src/us/sources/fundamentals.ts — COGS / avg inventory vs industry median
      threshold_example:
        min: 0
  enrich_tiers:
    low:
      note: All metrics in spec that enrichment can derive — always attempt
      examples:
        - roe_ttm
        - gross_margin
        - capex_to_revenue
        - dividend_yield
        - mid_cycle_pe
        - rule_of_40
    medium:
      note: Derive when annual rows or quote bulk provide inputs; peer/5y overlays
        when cache accumulates
      examples:
        - pe_ttm_vs_peer_median
        - mid_cycle_pe_vs_10y_median
        - mid_cycle_ev_ebitda_vs_peer
        - ev_ebitda_vs_5y_median
        - ps_vs_5y_median
        - revenue_yield_vs_peer
        - roe_vs_industry_median
        - fcf_yield_vs_risk_free
        - inventory_growth_minus_revenue
    high:
      note: Not in CLI MVP unless explicitly implemented by a sector enrich path;
        otherwise manual in Deep only
      examples:
        - NDR
        - SBC detail CN
        - capacity utilization
        - customer concentration
        - forward_peg
      implemented_exceptions:
        - cn_bank_regulatory_ratios_via_disclosure_scrape
  template_live_viability:
    consumer: full
    healthcare: full
    manufacturing: full
    cyclicals: full
    tech_saas: proxy
    financials:
      banks: proxy
      banks_proxy: proxy
      insurance: quant_too_hard
      other_financials: full
  deep_only_metrics:
    note: Not in live YAML supporting/required; Deep audit manual only
    metrics:
      - rotce
      - rotce_3y_avg
      - capacity_utilization
      - top_customer_concentration
      - same_store_sales_yoy
      - ndr
      - forward_peg
      - embedded_value_growth_3y
      - loss_ratio_3y_volatility
      - investment_yield
  metric_coverage:
    ref: cli/src/us/reports.ts
    meaning: Per-template required-metric presence after enrich; rate = present / routed
    manifest_review:
      meaning: Advisory hints when observed coverage diverges from
        template_live_viability
      note: Does not auto-update manifest; operator follows suggestion then ADR/spec
        edit
      promote_min_rate: 0.7
      demote_warn_rate: 0.5
      min_routed: 5
  metric_source_hygiene:
    ref: README.md#美股与历史功能
    policy: missing_over_proxy
    cn_vendor_roic:
      report: RPT_F10_FINANCE_MAINFINADATA
      column: ROIC
      unit: percent_to_decimal
    cn_balance_derive:
      report: RPT_DMSK_FN_BALANCE
      columns:
        - TOTAL_LIABILITIES
        - TOTAL_EQUITY
        - MONETARYFUNDS
    forbidden_silent_proxies:
      - roic_from_roe_scale
      - debt_from_revenue_times_alr
      - cash_from_ocf_scale
      - ebitda_from_gross_margin_scale
      - operating_margin_from_gross_margin_scale
      - us_roe_from_revenue_times_constant
      - us_alr_hardcoded
      - us_gross_profit_revenue_scale
      - us_ocf_net_income_fallback
    us_gaap_tags:
      revenue:
        - RevenueFromContractWithCustomerExcludingAssessedTax
        - Revenues
        - SalesRevenueNet
      net_income:
        - NetIncomeLoss
      operating_cash_flow:
        - NetCashProvidedByUsedInOperatingActivities
      gross_profit:
        - GrossProfit
      cost_of_revenue:
        - CostOfRevenue
        - CostOfGoodsAndServicesSold
      operating_profit:
        - OperatingIncomeLoss
      assets:
        - Assets
      liabilities:
        - Liabilities
      equity:
        - StockholdersEquity
      cash:
        - CashAndCashEquivalentsAtCarryingValue
      long_term_debt:
        - LongTermDebtNoncurrent
        - LongTermDebt
      short_term_debt:
        - DebtCurrent
        - ShortTermBorrowings
      income_tax:
        - IncomeTaxExpenseBenefit
      pretax_income:
        - IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
    us_roic_derive:
      nopat: operatingProfit * (1 - effectiveTaxRate)
      effective_tax_rate: clamp(incomeTax / pretaxIncome, 0, 0.35) when both present else 0.21
      invested_capital: totalEquity + longTermDebt + shortTermDebt - monetaryFunds
      omit_when: any required component missing or <= 0
  pass_logic:
    all_required_and_supporting_min_N_of_M:
      required: all must pass
      supporting: at least N of M listed supporting rules must pass
  metric_snapshot:
    include_on_pass: all metrics evaluated for the passed track
    per_field:
      value: null
      period: null
      currency: null
      source: null
      basis: null
      data_confidence: null
  funnel_flags:
    appended_to: candidate_record.funnel_flags
    consumed_by: orchestrator and stock-analysis-audit Deep hints
  routing_method:
    values:
      - gics
      - cn_industry_map
      - industry_proxy
      - fallback
    cn_primary: cn_industry_map
    fallback_confidence: low
  graham_composite:
    formula: pe_3y_avg * pb
    max_default: 22.5
  rule_of_40:
    formula: revenue_growth_pct + fcf_margin_pct
    fallback: operating_margin_pct with data_confidence_low
  mid_cycle:
    window_years_default: 7
    ref: template-screening.yaml#templates.cyclicals.normalization
  risk_free_rate:
    default: 0.04
    used_by: fcf_yield_vs_risk_free
    note: Static proxy for mispricing spread vs risk-free; not a live treasury feed
# 模板候选排序及展示席位
selectionPolicy:
  funnel_soft_cap:
    max_candidates_per_market: 20
    overflow: deferred.yaml
    ranking: template track seat allocation
  deferred_watchlist_cap:
    max_deferred_per_market: 20
  template_seat_allocation:
    pools:
      healthcare_quality:
        floor: 2
        cap: 5
      consumer_quality:
        floor: 2
        cap: 4
      manufacturing_quality:
        floor: 2
        cap: 4
      cyclicals_quality:
        floor: 0
        cap: 3
      financials_quality:
        floor: 0
        cap: 3
      tech_saas_quality:
        floor: 0
        cap: 3
      healthcare_mispricing:
        floor: 0
        cap: 1
      consumer_mispricing:
        floor: 0
        cap: 1
      cyclicals_mispricing:
        floor: 0
        cap: 1
      manufacturing_mispricing:
        floor: 0
        cap: 1
      financials_mispricing:
        floor: 0
        cap: 1
      tech_saas_mispricing:
        floor: 0
        cap: 1
    flex:
      confluence_weight_multiplier: 2
    backfill:
      tier1: same_template_quality
      tier2: global_quality
  ranking:
    method: template_seat_allocation
    tie_break: track confluence, then pool_score, then data_confidence, then
      north_star_metric, then ticker
    note: merged candidates.yaml rank is queue priority, not cross-template
      conviction
  pool_tie_break_north_star:
    consumer_quality: roe_5y_avg
    consumer_mispricing: fcf_yield
    healthcare_quality: gross_margin
    healthcare_mispricing: fcf_yield_vs_risk_free
    manufacturing_quality: roic_5y_avg
    manufacturing_mispricing: roic_ttm
    cyclicals_mispricing: mid_cycle_fcf_yield
    financials_quality: roe_ttm
    financials_mispricing: pb:asc
    tech_saas_quality: rule_of_40
    tech_saas_mispricing: revenue_yield_vs_peer
    default_quality: roic_5y_avg
    default_mispricing: fcf_yield
