# 各行业模板的必要条件和辅助条件
templates:
  financials:
    template: financials
    tracks:
      - quality
      - mispricing
    sub_templates:
      banks:
        gics_codes:
          - "401010"
          - "401020"
        quality_track:
          pass_if: all_required_and_supporting_min_4_of_6
          required:
            roe_ttm:
              min: 0.125
              market_overrides:
                CN: 0.11
                US: 0.125
            roa:
              default: 0.009
              market_overrides:
                CN: 0.0075
                US: 0.009
            npl_ratio:
              max: 0.025
            provision_coverage:
              min: 1.5
            capital_adequacy:
              min: 0.115
          supporting:
            - metric: pb_tangible
              max: 2.5
              missing: skip
            - metric: rotce
              min: 0.13
              missing: skip
            - metric: rotce_3y_avg
              min: 0.12
              missing: skip
            - metric: npl_ratio_yoy_change
              max: 0.005
              missing: skip
            - metric: nim
              min: 0.015
              missing: skip
            - metric: dividend_yield
              min: 0.03
              market_overrides:
                CN: 0.03
                US: 0.02
            - metric: roe_vs_industry_median
              min: 0
              missing: skip
        mispricing_track:
          pass_if: all_required_and_supporting_min_3_of_5
          required:
            roe_ttm:
              min: 0.108
              market_overrides:
                CN: 0.1
