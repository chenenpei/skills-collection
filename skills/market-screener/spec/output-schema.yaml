# Funnel output contract — YAML artifacts written by screener run

version: "0.1.0"

artifacts:
  candidates:
    filename: candidates.yaml
    description: Top-ranked securities after funnel soft cap (max 20 per market by default)

  deferred:
    filename: deferred.yaml
    description: Securities that passed sector funnels but ranked below the per-market soft cap

  excluded:
    filename: excluded.yaml
    description: >
      Securities removed by shared kill gates after live enrichment (or fixture load).
      Does not include quote-only prefilter skips — see prefilter_excluded.

  prefilter_excluded:
    filename: prefilter-excluded.yaml
    description: >
      Live adapter only. Securities skipped before financial enrichment because they
      fail universe profile gates (status, market cap floor, listing age). Same kill
      reason slugs as kill-gates.yaml universe phase. Written only when non-empty.

  routing_diagnostics:
    filename: routing-diagnostics.yaml
    description: >
      Per-market sector routing method distribution (routing section of funnel-diagnostics).

  funnel_diagnostics:
    filename: funnel-diagnostics.yaml
    description: >
      Full funnel replay stats: prefilter/kill reason breakdown, routing distribution,
      sector template pass rates, and stage counts for post-run analysis.

candidates_schema:
  run_metadata:
    required: [run_id, executed_at, quarter, market_scope, universe_count, candidate_count]
    fields:
      run_id: string
      executed_at: ISO8601
      quarter: string           # e.g. 2026-Q2
      market_scope: CN | US | CN,US
      universe_count: integer   # quote universe size incl. prefilter_excluded (live)
      candidate_count: integer
      deferred_count: integer   # passed funnel but below soft-cap rank
      funnel_soft_cap: integer  # e.g. 20
      spec_version: string
      tightening_profile: package_m
      data_source_profile: scheme_f

  candidates:
    type: array
    item_required: [rank, ticker, market, company_name, currency, routed_templates, routing_confidence, passed_track, metric_snapshot, audit_mode]
    fields:
      rank: integer
      ticker: string
      market: CN | US
      company_name: string
      currency: string
      gics_code: string
      gics_label: string
      industry_proxy: string    # provider label when true GICS unavailable
      routed_templates: array   # e.g. [tech_saas] or [tech_saas, manufacturing]
      routing_confidence: high | ambiguous_union | low
      routing_method: gics | cn_industry_map | industry_proxy | fallback
      matched_rule: string      # e.g. l1:电子, l2:电子/消费电子, gics:4520
      passed_track: quality | mispricing
      winning_template: string   # sector template with highest pool_score among passing tracks
      track_confluence: boolean  # winning template passes both quality and mispricing
      seat_source: floor | cap | flex | backfill_same_template | backfill_global
      sub_template: string      # e.g. banks, insurance — when applicable
      metric_snapshot:
        type: object
        note: Metrics that passed; each key may include data_confidence
      data_confidence: high | medium | low
      funnel_flags: array
      audit_mode: deep
      audit_hints: array        # optional extension; orchestrator passes to Deep prompt

deferred_schema:
  run_metadata:
    same_as: candidates_schema.run_metadata

  deferred:
    type: array
    description: Same shape as candidates; rank below funnel_soft_cap
    item_required: [rank, ticker, market, passed_track, metric_snapshot]
    note: Review quarterly for false rejects before next run

excluded_schema:
  run_metadata:
    same_as: candidates_schema.run_metadata

  excluded:
    type: array
    item_required: [ticker, market, kill_reason]
    fields:
      ticker: string
      market: CN | US
      kill_reason: string       # slug from kill-gates.yaml
      metric_snapshot: object
      enrichment_failure: string  # optional; cik_unresolved | fetch_failed when live enrich incomplete

prefilter_excluded_schema:
  run_metadata:
    same_as: candidates_schema.run_metadata

  prefilter_excluded:
    type: array
    description: Quote-only skips before enrichment (live adapter only)
    item_required: [ticker, market, kill_reason]
    fields:
      ticker: string
      market: CN | US
      kill_reason: string       # kill_status_excluded | kill_market_cap_below_floor | kill_listing_age_below_floor

routing_diagnostics_schema:
  run_metadata:
    same_as: candidates_schema.run_metadata

  summary:
    required: [total_routed, by_method, by_template, fallback_rate]
    fields:
      total_routed: integer
      by_method: object
      by_template: object
      fallback_rate: number

  unmapped_samples:
    type: array
    max_items: 50
    item_fields: [ticker, industry_proxy]

funnel_diagnostics_schema:
  run_metadata:
    same_as: candidates_schema.run_metadata

  stages:
    required:
      - quote_universe
      - prefilter_excluded
      - enriched_in_run
      - kill_excluded
      - kill_survivors
      - sector_passed
      - sector_filtered
      - candidates
      - deferred

  prefilter_by_reason: object
  kill_by_reason: object
  routing:
    same_as: routing_diagnostics_schema.summary
  sector_by_template:
    type: object
    note: template id → routed, passed_any_track, pass_rate
  by_pool_selected:
    type: object
    note: template_track pool key → count selected into candidates.yaml (e.g. consumer_quality)
  unmapped_samples:
    same_as: routing_diagnostics_schema.unmapped_samples

metric_snapshot_conventions:
  data_confidence_per_field: optional  # high | medium | low
  include: [value, period, currency, source, basis]

orchestrator:
  downstream_skill: stock-analysis-audit
  audit_mode: deep
  audit_hints_usage: append_to_prompt_not_skill_schema
  execution:
    mode: parallel_by_market
    note: Run CN and US Deep audits in separate agent sessions concurrently
  deep_limit:
    default_per_market: 20
    applies_to: candidates.yaml_by_rank
    deep_all_flag: --deep-all
    deep_all_requires_explicit_user_request: true
  report_output:
    path: "{output}/{quarter}/audit/{market}/{ticker}.md"

audit_summary_schema:
  filename: audit-summary.yaml
  location: "{output}/{quarter}/audit-summary.yaml"
  description: Post-Deep qualitative triage output for landmine phase
  fields:
    quarter: string
    deep_limit_per_market: integer
    shortlist_for_landmine:
      type: array
      item_fields: [ticker, market, deep_verdict_slug, landmine_priority, key_risk]
    rejected_after_deep:
      type: array
      item_fields: [ticker, market, deep_verdict_slug, reject_reason]
    deep_deferred:
      type: array
      description: Candidates not Deep-audited due to limit
      item_fields: [ticker, market, rank]

landmines_schema:
  filename: landmines.yaml
  location: "{output}/{quarter}/landmines.yaml"
  ref: landmine-rules.yaml
  description: Computed landmine prices for manual GTC limits or alerts
  human_execution: true
  fields:
    quarter: string
    generated_at: ISO8601
    landmines:
      type: array
      item_required: [ticker, market, landmine_price, currency, basis, passed_track]
      item_fields:
        ticker: string
        market: CN | US
        landmine_price: number
        currency: string
        basis: string
        passed_track: quality | mispricing
        fair_value_reference: number
        current_price: number
        formula_slug: string
        expiry: GTC
        notes: string

alerts_schema:
  filename: alerts.yaml
  location: "{output}/{quarter}/alerts.yaml"
  phase: 2_placeholder
  ref: trigger-discipline.yaml#alerts_schema_placeholder
  description: Generated by screener alert when price hits landmine; not in MVP
  note: MVP uses broker alerts; agent applies trigger-discipline.yaml heuristics manually
