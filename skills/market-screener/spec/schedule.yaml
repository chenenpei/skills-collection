# Scheduled quarterly run — unified CN+US same day, after both markets' disclosure complete
# Rule: execution = first weekend on or after max(CN anchor, US anchor) for that cycle
# Ref: user choice — same day run; gate on later market disclosure completion

version: "0.1.0"
status: confirmed  # grill: unified CN+US same day; later-market gate; US +45d; 3 runs/year

principle:
  slug: quarterly_unified_after_later_disclosure
  markets_per_run: [CN, US]
  cli: screener run --markets CN,US
  gate: first_weekend_on_or_after_max_anchors
  never: run_before_later_market_anchor

cycles_per_year: 4

# Anchors are inclusive "disclosure substantially complete" dates per reporting cycle.
# US uses large-accelerated-filer 10-Q/10-K practical deadlines (~45 days post quarter-end).
# CN uses statutory exchange disclosure deadlines.
# Adjust buffers in spec if adapters detect material straggler rate.

cycles:
  - id: post_q1_and_cn_annual
    quarter_tag: Q1
    description: CN annual + Q1 reports; US Q1 10-Q season
    cn_anchor:
      date_rule: april_30
      note: A-share annual report and Q1 report deadline
    us_anchor:
      date_rule: days_after_quarter_end
      quarter_end: march_31
      days: 45
      approximate: may_15
      note: Most large US filers complete Q1 10-Q by mid-May
    later_market: US
    typical_first_run: first_weekend_on_or_after_may_15

  - id: post_q2_and_cn_half
    quarter_tag: Q2
    description: CN semi-annual; US Q2 10-Q season
    cn_anchor:
      date_rule: august_31
      note: A-share semi-annual report deadline
    us_anchor:
      date_rule: days_after_quarter_end
      quarter_end: june_30
      days: 45
      approximate: august_15
    later_market: CN
    typical_first_run: first_weekend_on_or_after_august_31

  - id: post_q3
    quarter_tag: Q3
    description: CN Q3; US Q3 10-Q season
    cn_anchor:
      date_rule: october_31
      note: A-share Q3 report deadline
    us_anchor:
      date_rule: days_after_quarter_end
      quarter_end: september_30
      days: 45
      approximate: november_15
    later_market: US
    typical_first_run: first_weekend_on_or_after_november_15

  - id: post_q4_us_and_cn_annual_window
    quarter_tag: Q4
    description: US Q4/10-K season completes Feb; next CN annual+Q1 cycle gated on Apr 30 — this cycle aligns with post_q1_and_cn_annual for unified quarterly run
    note: No separate fourth run; US Q4 freshness rolls into following post_q1_and_cn_annual run after CN Apr 30 gate
    us_q4_anchor:
      date_rule: days_after_quarter_end
      quarter_end: december_31
      days: 45
      approximate: february_15
    cn_next_annual_anchor: april_30
    later_market: CN
    scheduled_run: merged_into_post_q1_and_cn_annual

date_resolution:
  algorithm: |
    1. For the active cycle, read cn_anchor and us_anchor for that calendar year.
    2. later_anchor_date = max(cn_anchor_date, us_anchor_date).
    3. scheduled_run_date = first Saturday on or after later_anchor_date.
    4. If that Saturday is unsuitable, user may slip to Sunday same weekend or next weekend (manual).
  cli_future: screener schedule --year YYYY  # Phase 2 optional; prints resolved dates

same_day_execution:
  markets: CN,US
  order_suggestion:
    - Run CN and US funnel in parallel or sequential same day
    - Deep audit parallel_by_market same day
    - Single audit-summary and landmine pass per quarter_tag

calendar_example_2026:
  post_q1_and_cn_annual: "2026-05-16 or 2026-05-17 (first weekend after ~May 15)"
  post_q2_and_cn_half: "2026-09-05 or 2026-09-06 (first weekend after Aug 31)"
  post_q3: "2026-11-21 or 2026-11-22 (first weekend after ~Nov 15)"

agent_reminder: Do not run screener run before later_anchor_date even if user requests early; warn on stale CN or US filings.
