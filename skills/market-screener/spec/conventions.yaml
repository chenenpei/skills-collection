# Spec YAML conventions for market-screener
# Read by: CLI validate, future funnel-engine
# Terms: ../CONTEXT.md

version: "0.1.0"

threshold_syntax:
  simple:
    example: { min: 0.12 }
    meaning: metric value must be >= min

  max_only:
    example: { max: 0.25 }
    meaning: metric value must be <= max

  market_overrides:
    example:
      default: 0.009
      market_overrides: { CN: 0.0075, US: 0.009 }
    meaning: Use market-specific floor/ceiling when market is CN or US

  market_metric:
    example:
      CN: { min: 1.50 }
      US: { field: rbc_ratio, min: 200, missing: data_confidence_low }
    meaning: Different metric fields per market when definitions differ

  missing:
    values: [skip, data_confidence_low]
    skip: metric not counted toward supporting pass count
    data_confidence_low: record low confidence; do not prekill at funnel stage

  allowed_keys:
    note: CLI threshold evaluator only understands these rule keys
    keys: [min, max, default, market_overrides, missing, field]
    unsupported_example: { max_decline_pp: 5 }  # invalid — use derived metric + max instead

derived_metrics:
  gross_margin_3y_max_decline_pp:
    meaning: Largest peak-to-trough drop in gross margin over the last 3 fiscal years
    unit: percentage_points
    example: 2.5 means a 2.5pp decline from the 3y peak margin
    compute_from: annual gross_margin series in enrichment layer (cli/src/data/metrics.ts)
    threshold: { max: 5 }
    replaces: gross_margin_3y_stable with max_decline_pp rule (removed — engine ignored it)

  operating_margin:
    meaning: Latest fiscal-year operating margin (operating profit / revenue when available)
    unit: ratio
    compute_from: cli/src/data/metrics.ts — operatingProfit/revenue only; omit when missing
    used_by: operating_margin_vs_industry benchmark overlay

  gross_margin_vs_industry:
    meaning: Security gross margin minus industry-peer median gross margin (same market + industryProxy group)
    unit: ratio
    compute_from: cli/src/data/metrics.ts after enrichment
    threshold_example: { min: 0.05 }  # consumer quality track

  operating_margin_vs_industry:
    meaning: Security operating margin minus industry-peer median operating margin
    unit: ratio
    compute_from: cli/src/data/metrics.ts — median of operating_margin within industryProxy group
    threshold_example: { min: 0 }  # consumer quality track
    note: Requires operating_margin from derive; not a ROE proxy

  capex_to_revenue:
    meaning: Average of abs(capex) / revenue over last 2–3 fiscal years with capex data
    min_years: 2
    confidence: medium when 2 years, high when 3 years
    unit: ratio
    compute_from: cli/src/data/metrics.ts — CONSTRUCT_LONG_ASSET (CN) or SEC capex tags (US)
    threshold_example: { max: 0.15 }  # manufacturing quality track

  inventory_turnover_vs_industry:
    meaning: Security inventory turnover minus industry-peer median turnover
    unit: ratio
    compute_from: cli/src/data/metrics.ts — COGS / avg inventory vs industry median
    threshold_example: { min: 0 }  # manufacturing quality track

live_enrichment:
  prefilter:
    ref: kill-gates.yaml#live_quote_prefilter
    applies: before per-ticker HTTP enrichment (--adapter live only)
  cache:
    path: cli/data/cache/{quarter}/{market}/{ticker}.json
    skip_flag: --skip-cache
    empty_rows: not cached (refetch on next run)
  concurrency:
    flag: --enrich-concurrency
    default: 4
    note: Each ticker may issue 2 HTTP calls; host limits cap East Money (8) and SEC (4) in-flight

enrich_tiers:
  low:
    note: All metrics in spec that enrichment can derive — always attempt
    examples: [roe_ttm, gross_margin, capex_to_revenue, dividend_yield, mid_cycle_pe, rule_of_40]
  medium:
    note: Derive when annual rows or quote bulk provide inputs; peer/5y overlays when cache accumulates
    examples:
      - pe_ttm_vs_peer_median
      - mid_cycle_pe_vs_10y_median
      - mid_cycle_ev_ebitda_vs_peer
      - ev_ebitda_vs_5y_median
      - ps_vs_5y_median
      - revenue_yield_vs_peer
      - roe_vs_industry_median
      - fcf_yield_vs_risk_free
      - inventory_growth_minus_revenue
  high:
    note: Not in CLI MVP — manual in Deep only
    examples: [bank regulatory ratios, NDR, SBC detail CN, capacity utilization, customer concentration, forward_peg]

template_live_viability:
  # full | proxy | quant_too_hard — ADR 0006
  consumer: full
  healthcare: full
  manufacturing: full
  cyclicals: full
  tech_saas: proxy
  financials:
    banks: quant_too_hard
    banks_proxy: proxy
    insurance: quant_too_hard
    other_financials: full

deep_only_metrics:
  note: Not in live YAML supporting/required; Deep audit manual only
  metrics:
    - capacity_utilization
    - top_customer_concentration
    - same_store_sales_yoy
    - ndr
    - forward_peg
    - embedded_value_growth_3y
    - loss_ratio_3y_volatility
    - investment_yield

metric_coverage:
  ref: funnel-diagnostics.yaml#metric_coverage
  meaning: Per-template required-metric presence after enrich; rate = present / routed
  manifest_review:
    meaning: Advisory hints when observed coverage diverges from template_live_viability
    note: Does not auto-update manifest; operator follows suggestion then ADR/spec edit
    promote_min_rate: 0.70
    demote_warn_rate: 0.50
    min_routed: 5

metric_source_hygiene:
  ref: docs/adr/0005-metric-source-hygiene.md
  policy: missing_over_proxy
  cn_vendor_roic:
    report: RPT_F10_FINANCE_MAINFINADATA
    column: ROIC
    unit: percent_to_decimal
  cn_balance_derive:
    report: RPT_DMSK_FN_BALANCE
    columns: [TOTAL_LIABILITIES, TOTAL_EQUITY, MONETARYFUNDS]
  forbidden_silent_proxies:
    - roic_from_roe_scale
    - debt_from_revenue_times_alr
    - cash_from_ocf_scale
    - ebitda_from_gross_margin_scale
    - operating_margin_from_gross_margin_scale
    - us_roe_from_revenue_times_constant
    - us_alr_hardcoded
    - us_gross_profit_revenue_scale
    - us_ocf_net_income_fallback
  us_gaap_tags:
    revenue: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet]
    net_income: [NetIncomeLoss]
    operating_cash_flow: [NetCashProvidedByUsedInOperatingActivities]
    gross_profit: [GrossProfit]
    cost_of_revenue: [CostOfRevenue, CostOfGoodsAndServicesSold]
    operating_profit: [OperatingIncomeLoss]
    assets: [Assets]
    liabilities: [Liabilities]
    equity: [StockholdersEquity]
    cash: [CashAndCashEquivalentsAtCarryingValue]
    long_term_debt: [LongTermDebtNoncurrent, LongTermDebt]
    short_term_debt: [DebtCurrent, ShortTermBorrowings]
    income_tax: [IncomeTaxExpenseBenefit]
    pretax_income: [IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest]
  us_roic_derive:
    nopat: operatingProfit * (1 - effectiveTaxRate)
    effective_tax_rate: clamp(incomeTax / pretaxIncome, 0, 0.35) when both present else 0.21
    invested_capital: totalEquity + longTermDebt + shortTermDebt - monetaryFunds
    omit_when: any required component missing or <= 0

pass_logic:
  all_required_and_supporting_min_N_of_M:
    required: all must pass
    supporting: at least N of M listed supporting rules must pass

  package_m_defaults:
    note: Tightened 2026 grill session
    typical_supporting_bars:
      tech_saas_quality: 5_of_7
      tech_saas_mispricing: 4_of_6
      consumer_quality: 5_of_7
      consumer_mispricing: 4_of_6
      cyclicals_mispricing: 4_of_6
      manufacturing_quality: 5_of_5
      manufacturing_mispricing: 4_of_6
      financials_banks: 4_of_6  # unchanged; sparse bank data

funnel_soft_cap:
  max_candidates_per_market: 20
  overflow: deferred.yaml
  ranking: template track seat allocation (see template_seat_allocation)

deferred_watchlist_cap:
  max_deferred_per_market: 20

deferred_lite_sweep:
  note: Tier-2 qualitative pass; reuses stock-analysis-audit Lite (not Deep)
  default_top_n: 8
  applies_to: deferred.yaml ordered by rank ascending
  report_path: "{output}/{quarter}/audit/{market}/{ticker}.lite.md"
  skip_when:
    - user_requests_deep_all
    - deferred.yaml empty for market
  promote_next_quarter_when:
    lite_verdict_slug:
      - verdict_quality_reasonable_price
      - verdict_medium_term_revaluation
    min_confidence: 3

template_seat_allocation:
  pools:
    healthcare_quality: { floor: 2, cap: 5 }
    consumer_quality: { floor: 2, cap: 4 }
    manufacturing_quality: { floor: 2, cap: 4 }
    cyclicals_quality: { floor: 0, cap: 3 }
    financials_quality: { floor: 0, cap: 3 }
    tech_saas_quality: { floor: 0, cap: 3 }
    healthcare_mispricing: { floor: 0, cap: 1 }
    consumer_mispricing: { floor: 0, cap: 1 }
    cyclicals_mispricing: { floor: 0, cap: 1 }
    manufacturing_mispricing: { floor: 0, cap: 1 }
    financials_mispricing: { floor: 0, cap: 1 }
    tech_saas_mispricing: { floor: 0, cap: 1 }
  flex:
    confluence_weight_multiplier: 2
  backfill:
    tier1: same_template_quality
    tier2: global_quality

ranking:
  method: template_seat_allocation
  tie_break: track confluence, then pool_score, then data_confidence, then north_star_metric, then ticker
  note: merged candidates.yaml rank is Deep queue priority, not cross-template conviction

pool_tie_break_north_star:
  consumer_quality: roe_5y_avg
  consumer_mispricing: fcf_yield
  healthcare_quality: gross_margin
  healthcare_mispricing: fcf_yield_vs_risk_free
  manufacturing_quality: roic_5y_avg
  manufacturing_mispricing: roic_ttm
  cyclicals_mispricing: mid_cycle_fcf_yield
  financials_quality: roe_ttm
  financials_mispricing: pb:asc
  tech_saas_quality: rule_of_40
  tech_saas_mispricing: revenue_yield_vs_peer
  default_quality: roic_5y_avg
  default_mispricing: fcf_yield

metric_snapshot:
  include_on_pass: all metrics evaluated for the passed track
  per_field: { value, period, currency, source, basis, data_confidence }

funnel_flags:
  appended_to: candidate_record.funnel_flags
  consumed_by: orchestrator and stock-analysis-audit Deep hints

audit_hints:
  not_part_of: stock-analysis-audit core schema
  passed_by: orchestrator into Deep audit prompt
  fallback_note: When routing_method is fallback, sector scoring is skipped (routing_too_hard); Deep must flag sector classification uncertainty and honor audit_hints

sector_kill_gates:
  execution: spec_contract_only
  note: Declared per sector template; NOT evaluated by CLI MVP. Shared kill-gates.yaml + template thresholds enforce subset at funnel time. Deep checks use audit_hints on candidate_record, not sector_kill_gates.

routing_method:
  values: [gics, cn_industry_map, industry_proxy, fallback]
  cn_primary: cn_industry_map
  fallback_confidence: low

graham_composite:
  formula: pe_3y_avg * pb
  max_default: 22.5

rule_of_40:
  formula: revenue_growth_pct + fcf_margin_pct
  fallback: operating_margin_pct with data_confidence_low

mid_cycle:
  window_years_default: 7
  ref: templates/cyclicals.yaml#normalization

risk_free_rate:
  default: 0.04
  used_by: fcf_yield_vs_risk_free
  note: Static proxy for mispricing spread vs risk-free; not a live treasury feed
