# Healthcare / pharma sector funnel
# Aligns: stock-analysis-audit/spec/data.md Healthcare and pharma
# Value alignment: Buffett/Li Lu compounder quality; classification.md biotech exception; Graham mispricing

version: "0.1.0"
template: healthcare
tracks: [quality, mispricing]

quality_track:
  pass_if: all_required_and_supporting_min_5_of_8
  required:
    gross_margin_3y_max_decline_pp: { max: 5 }
    net_debt_to_ebitda: { max: 3.0 }
    gross_margin: { min: 0.45 }
  supporting:
    - { metric: gross_margin, min: 0.55 }
    - { metric: gross_margin_vs_industry, min: 0.03 }
    - { metric: revenue_3y_cagr, min: 0.05 }
    - { metric: debt_to_equity, max: 0.55 }
    - { metric: operating_margin_vs_industry, min: -0.08 }
    - { metric: roe_5y_avg, min: 0.12, if_unprofitable: skip }
    - { metric: fcf_conversion_5y, min: 0.80, if_fcf_negative: skip }
    - { metric: roic_5y_avg, min: 0.12, if_unprofitable: skip }
  funnel_flags:
    - biotech_unprofitable_quality_exception_when_roe_fcf_skipped

mispricing_track:
  pass_if: all_required_and_supporting_min_4_of_6
  required:
    roe_ttm: { min: 0.08 }
    gross_margin: { min: 0.35 }
    fcf_yield: { min: 0.04 }
    net_debt_to_ebitda: { max: 3.0 }
  supporting:
    - { metric: graham_composite, max: 22.5 }
    - { metric: pe_vs_5y_median, max: 0.80, missing: skip }
    - { metric: fcf_yield_vs_risk_free, min: 0.04, missing: skip }
    - { metric: price_vs_52w_high, max: 0.70 }
    - { metric: gross_margin_3y_max_decline_pp, max: 8 }
    - { metric: operating_margin_vs_industry, min: -0.05 }

audit_hints:
  - verify_rd_runway_and_dilution_in_deep
  - verify_patent_cliff_if_margin_declining
  - verify_margin_collapse_risk
  - verify_revenue_sustainability_not_structural_decline
  - apply_classification_biotech_sector_exception
