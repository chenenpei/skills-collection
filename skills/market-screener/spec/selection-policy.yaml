# Candidate selection and ranking policy for market-screener

version: "0.1.0"

funnel_soft_cap:
  max_candidates_per_market: 20
  overflow: deferred.yaml
  ranking: template track seat allocation

deferred_watchlist_cap:
  max_deferred_per_market: 20

template_seat_allocation:
  pools:
    healthcare_quality: { floor: 2, cap: 5 }
    consumer_quality: { floor: 2, cap: 4 }
    manufacturing_quality: { floor: 2, cap: 4 }
    cyclicals_quality: { floor: 0, cap: 3 }
    financials_quality: { floor: 0, cap: 3 }
    tech_saas_quality: { floor: 0, cap: 3 }
    healthcare_mispricing: { floor: 0, cap: 1 }
    consumer_mispricing: { floor: 0, cap: 1 }
    cyclicals_mispricing: { floor: 0, cap: 1 }
    manufacturing_mispricing: { floor: 0, cap: 1 }
    financials_mispricing: { floor: 0, cap: 1 }
    tech_saas_mispricing: { floor: 0, cap: 1 }
  flex:
    confluence_weight_multiplier: 2
  backfill:
    tier1: same_template_quality
    tier2: global_quality

ranking:
  method: template_seat_allocation
  tie_break: track confluence, then pool_score, then data_confidence, then north_star_metric, then ticker
  note: merged candidates.yaml rank is queue priority, not cross-template conviction

pool_tie_break_north_star:
  consumer_quality: roe_5y_avg
  consumer_mispricing: fcf_yield
  healthcare_quality: gross_margin
  healthcare_mispricing: fcf_yield_vs_risk_free
  manufacturing_quality: roic_5y_avg
  manufacturing_mispricing: roic_ttm
  cyclicals_mispricing: mid_cycle_fcf_yield
  financials_quality: roe_ttm
  financials_mispricing: pb:asc
  tech_saas_quality: rule_of_40
  tech_saas_mispricing: revenue_yield_vs_peer
  default_quality: roic_5y_avg
  default_mispricing: fcf_yield
